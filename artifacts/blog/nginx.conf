server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Performance: zero-copy file serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # File descriptor cache
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # MIME types
    include /etc/nginx/mime.types;

    # Gzip compression (on-the-fly for text, XML — not for already-compressed assets)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";

    # Health check
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Sitemap — served directly as static XML (bypass Next.js completely)
    location /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files /sitemap.xml =404;
    }

    # Robots.txt — served directly as static text
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        try_files /robots.txt =404;
    }

    # OG image — served directly as static PNG
    location = /og.png {
        add_header Cache-Control "public, max-age=604800";
        try_files /og.png =404;
    }

    # Cache static assets with content hashes (immutable)
    location ~* ^/_next/static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API routes — proxy to Next.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # All other requests — proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
