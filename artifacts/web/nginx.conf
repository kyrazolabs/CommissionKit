server {
    listen 80;
    server_name commissionk.it www.commissionk.it staging.commissionk.it _;

    root /usr/share/nginx/html;
    index index.html;

    # Performance: zero-copy file serving, packet optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # File descriptor cache
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Output buffering
    output_buffers 32 32k;
    postpone_output 1460;

    # MIME types
    include /etc/nginx/mime.types;
    types {
        video/mp4 mp4;
        video/webm webm;
        image/svg+xml svg svgz;
    }

    # Gzip compression (on-the-fly for text, CSS, JS — not for already-compressed video)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ~ ^/docs(/.*)?$ {
        return 301 https://docs.commissionk.it$1;
    }

    # Root / and /home serve index.html (which is pre-rendered)
    location = / {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files /index.html =404;
    }

    location = /home {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files /index.html =404;
    }

    # Public pre-rendered SEO pages (built at deploy time) — allow CDN caching
    location /commission-calculator {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri/ /index.html =404;
    }

    location /privacy {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri/ /index.html =404;
    }

    location /terms {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri/ /index.html =404;
    }

    location /security {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri/ /index.html =404;
    }

    # SPA Routing — app.html must never be cached (new JS hashes on every deploy)
    location /  {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /app.html;
    }

    # Cache static assets with content hashes (immutable)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
