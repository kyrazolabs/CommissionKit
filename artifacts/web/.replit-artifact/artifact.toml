kind = "web"
previewPath = "/"
title = "CommissionKit"
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21889

[services.development]
run = "bun run --filter @workspace/web dev"

[services.production]
build = [ "bun", "run", "--filter", "@workspace/web", "build" ]
publicDir = "artifacts/web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21889"
BASE_PATH = "/"
