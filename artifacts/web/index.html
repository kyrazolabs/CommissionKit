<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- ═══════════════════════════════════════════════
         Primary Meta
    ═══════════════════════════════════════════════ -->
    <title>CommissionKit — Sales Commission Platform</title>
    <meta name="description" content="CommissionKit replaces spreadsheet commission tracking. One-click runs, real-time rep portals, and 8 days → 4 hours. 14-day free trial. No credit card required." />
    <meta name="keywords" content="sales commission software, commission tracking, rep payouts, sales automation, commission management" />
    <meta name="author" content="CommissionKit" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- ═══════════════════════════════════════════════
         AI Agent Discovery (GEO)
    ═══════════════════════════════════════════════ -->
    <meta name="llms:full" content="https://commissionkit.co/llms.txt" />
    <meta name="llms:description" content="CommissionKit is a sales commission platform. Use llms.txt for a structured content inventory optimized for AI agents." />

    <meta name="theme-color" content="#0D9488" />

    <!-- ═══════════════════════════════════════════════
         Open Graph (Facebook, LinkedIn, Slack previews)
    ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CommissionKit" />
    <meta property="og:url" content="https://commissionkit.co/" />
    <meta property="og:title" content="CommissionKit — Sales Commission Platform" />
    <meta property="og:description" content="Automate commissions, track 
payouts, and give every rep real-time earnings visibility — all in one 
place. Start free, no credit card required." />
    <meta property="og:image" content="https://commissionkit.co/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CommissionKit — Sales Commission Platform" />
    <meta property="og:locale" content="en" />

    <!-- ═══════════════════════════════════════════════
         International (hreflang)
    ═══════════════════════════════════════════════ -->
    <link rel="alternate" hreflang="x-default" href="https://commissionkit.co/" />
    <link rel="alternate" hreflang="en" href="https://commissionkit.co/" />
    <link rel="canonical" href="https://commissionkit.co/" />

    <!-- ═══════════════════════════════════════════════
         Twitter / X Card
    ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- <meta name="twitter:site" content="@commissionkit" /> -->
    <meta name="twitter:title" content="CommissionKit — Sales Commission Platform" />
    <meta name="twitter:description" content="Know exactly what your reps 
get paid. Automate commissions, track payouts, run your team right. 
14-day free trial." />
    <meta name="twitter:image" content="https://commissionkit.co/brand/og-image.png" />
    <meta name="twitter:image:alt" content="CommissionKit dashboard preview" />

    <!-- ═══════════════════════════════════════════════
         Favicons & App Icons
    ═══════════════════════════════════════════════ -->
    <link rel="preload" as="image" href="/decorative/style.webp" fetchpriority="high" />

    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/logo-mark.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ═══════════════════════════════════════════════
         Structured Data (JSON-LD)
    ═══════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CommissionKit",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Automate sales commissions for your team. Track reps, deals, and payouts — all in one place.",
      "url": "https://commissionkit.co",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "14-day free trial, no credit card required"
      },
      "publisher": {
        "@type": "Organization",
        "name": "CommissionKit",
        "url": "https://commissionkit.co",
        "logo": {
          "@type": "ImageObject",
          "url": "https://commissionkit.co/brand/logo-full.svg"
        }
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════════

    ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
