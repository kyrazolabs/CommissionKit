name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck libs (tsc --build)
        run: bun run typecheck:libs

      - name: Typecheck apps + scripts (tsc --noEmit)
        run: bun run --workspaces --if-present --filter "./artifacts/**" --filter "./scripts" typecheck

  build:
    name: Build
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck libs
        run: bun run typecheck:libs

      - name: Build all workspaces
        run: bun run --workspaces --if-present build

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@workspace/api"
          - "@workspace/blog"
          - "@workspace/db"
          - "@workspace/queue"
          - "@workspace/web"
          - "@workspace/email-templates"
          - "@workspace/plugins-core"
          - "@workspace/plugins-custom"
          - "@workspace/plugins-hubspot"
          - "@workspace/plugins-odoo"
          - "@workspace/plugins-salesforce"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test ${{ matrix.workspace }}
        run: bun test --filter ${{ matrix.workspace }}
        env:
          REDIS_URL: redis-mock://
          NODE_ENV: test
          SENTRY_ENABLED: "false"
