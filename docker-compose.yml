version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - NODE_ENV=production
      # Important: Coolify will automatically inject matching environment variables from the Dashboard
      # like REDIS_URL, MONGO_URL, BETTER_AUTH_SECRET, etc.
    expose:
      - "8088"
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
