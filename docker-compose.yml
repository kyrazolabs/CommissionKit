version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    environment:
      - NODE_ENV=production
      - PORT=8088
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TLS=false
      # Other variables (MONGO_URL, BETTER_AUTH_SECRET, etc.) will be injected by Coolify
    expose:
      - "8088"
    depends_on:
      - redis
      - mongo
    restart: always
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=api
      - coolify.resourceName=api
      - coolify.projectName=the-forge
      - coolify.serviceName=api
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=1
      - coolify.service.subType=application
      - coolify.service.subName=api

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "80"
    depends_on:
      - api
    restart: always
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=web
      - coolify.resourceName=web
      - coolify.projectName=the-forge
      - coolify.serviceName=web
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=2
      - coolify.service.subType=application
      - coolify.service.subName=web

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: always
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=redis
      - coolify.resourceName=redis
      - coolify.projectName=the-forge
      - coolify.serviceName=redis
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=3
      - coolify.service.subType=database
      - coolify.service.subName=redis

  mongo:
    image: "mongo:7.0"
    command:
      - mongod
      - "--config"
      - /etc/mongo/mongod.conf
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=Dw5EDE7vj87jTKBdzbT7jxc8SJisdTqYNORxMgFV2GJfLQ1lI1UQN515M6RF7V3f
      - MONGO_INITDB_DATABASE=default
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=mongo
      - coolify.resourceName=mongo
      - coolify.projectName=the-forge
      - coolify.serviceName=mongo
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=4
      - coolify.service.subType=database
      - coolify.service.subName=mongo
    healthcheck:
      test:
        - CMD
        - echo
        - ok
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: "0"
    memswap_limit: "0"
    mem_swappiness: 60
    mem_reservation: "0"
    cpus: 0.0
    cpu_shares: 1024
    volumes:
      - mongo_configdb:/data/configdb
      - mongo_data:/data/db
      - type: bind
        source: ./infra/mongod.conf
        target: /etc/mongo/mongod.conf
        read_only: true

volumes:
  redis_data:

  mongo_configdb:
    name: mongo_configdb
    external: false
  mongo_data:
    name: mongo_data
    external: false
