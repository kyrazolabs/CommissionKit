version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    environment:
      - NODE_ENV=production
      - PORT=8088
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TLS=false
    expose:
      - "8088"
    restart: always
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8088/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - commissionkit-network
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=api
      - coolify.resourceName=api
      - coolify.projectName=the-forge
      - coolify.serviceName=api
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=1
      - coolify.service.subType=application
      - coolify.service.subName=api

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web
    expose:
      - "80"
    depends_on:
      - api
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - commissionkit-network
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=web
      - coolify.resourceName=web
      - coolify.projectName=the-forge
      - coolify.serviceName=web
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=2
      - coolify.service.subType=application
      - coolify.service.subName=web

  blog:
    build:
      context: .
      dockerfile: Dockerfile.blog
    container_name: blog
    expose:
      - "3000"
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - commissionkit-network
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0
      - coolify.serviceId=1
      - coolify.type=service
      - coolify.name=blog
      - coolify.resourceName=blog
      - coolify.projectName=the-forge
      - coolify.serviceName=blog
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=3
      - coolify.service.subType=application
      - coolify.service.subName=blog

networks:
  commissionkit-network:
    name: commissionkit-network
    external: false
