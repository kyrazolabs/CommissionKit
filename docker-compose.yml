version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - NODE_ENV=production
      - PORT=8088
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TLS=false
      # Other variables (MONGO_URL, BETTER_AUTH_SECRET, etc.) will be injected by Coolify
    expose:
      - "8088"
    depends_on:
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "80"
    depends_on:
      - api
    restart: always

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
