openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CommissionKit API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reps
    description: Sales rep management
  - name: plans
    description: Commission plan management
  - name: deals
    description: Deal management and CSV import
  - name: runs
    description: Commission calculation runs
  - name: dashboard
    description: Summary and analytics
  - name: api-keys
    description: Workspace API key management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Reps ──────────────────────────────────────────────────────────────────
  /reps:
    get:
      operationId: listReps
      tags: [reps]
      summary: List all sales reps
      parameters:
        - name: search
          in: query
          description: "Search by rep name or email"
          schema:
            type: string
      responses:
        "200":
          description: List of reps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rep"
    post:
      operationId: createRep
      tags: [reps]
      summary: Create a sales rep
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepBody"
      responses:
        "201":
          description: Created rep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rep"

  /reps/{id}:
    get:
      operationId: getRep
      tags: [reps]
      summary: Get a rep by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rep"
    put:
      operationId: updateRep
      tags: [reps]
      summary: Update a rep
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepBody"
      responses:
        "200":
          description: Updated rep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rep"
    delete:
      operationId: deleteRep
      tags: [reps]
      summary: Delete a rep
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Plans ─────────────────────────────────────────────────────────────────
  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List all commission plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a commission plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanBody"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    put:
      operationId: updatePlan
      tags: [plans]
      summary: Update a commission plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Deals ─────────────────────────────────────────────────────────────────
  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List deals
      parameters:
        - name: search
          in: query
          description: "Search by deal name or rep name"
          schema:
            type: string
        - name: repId
          in: query
          schema:
            type: string
        - name: period
          in: query
          description: "Filter by period (YYYY-MM)"
          schema:
            type: string
        - name: paymentStatus
          in: query
          description: "Filter by payment status"
          schema:
            $ref: "#/components/schemas/DealPaymentStatus"
      responses:
        "200":
          description: List of deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a single deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDealBody"
      responses:
        "201":
          description: Created deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /deals/import:
    post:
      operationId: importDeals
      tags: [deals]
      summary: Bulk import deals from parsed CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportDealsBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDealsResult"

  /deals/{id}:
    delete:
      operationId: deleteDeal
      tags: [deals]
      summary: Delete a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
    put:
      operationId: updateDeal
      tags: [deals]
      summary: Update an existing deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDealBody"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  # ── Commission Runs ────────────────────────────────────────────────────────
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List commission runs
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionRun"
    post:
      operationId: createRun
      tags: [runs]
      summary: Trigger a commission calculation run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunBody"
      responses:
        "201":
          description: Run with results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRunWithResults"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run with its results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run with results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRunWithResults"

  # ── Reports ──────────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: getReports
      tags: [dashboard]
      summary: Get comprehensive reports data for charts
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: "Start date (YYYY-MM-DD)"
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: "End date (YYYY-MM-DD)"
        - name: interval
          in: query
          schema:
            type: string
            enum: [day, month]
          description: "Aggregation interval"
      responses:
        "200":
          description: Reports data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportData"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Team-wide commission summary for current period
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/rep-summary/{repId}:
    get:
      operationId: getRepSummary
      tags: [dashboard]
      summary: Summary for a single rep including deal-by-deal breakdown
      parameters:
        - name: repId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
          description: "Filter by period (YYYY-MM). Defaults to current period."
      responses:
        "200":
          description: Rep summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepSummary"

  # ── API Keys ───────────────────────────────────────────────────────────────
  /api-keys:
    get:
      tags: [api-keys]
      summary: List all active API keys for the workspace
      operationId: getApiKeys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
    post:
      tags: [api-keys]
      summary: Create a new API key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"

  /api-keys/{id}:
    delete:
      tags: [api-keys]
      summary: Revoke an API key
      operationId: deleteApiKey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Rep ──────────────────────────────────────────────────────────────────
    Rep:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        planId:
          type: string
          nullable: true
        planName:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, name, email, role, planId, planName, createdAt]

    CreateRepBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        planId:
          type: string
          nullable: true
      required: [name, email, role]

    # ── Plan ─────────────────────────────────────────────────────────────────
    PlanTier:
      type: object
      properties:
        id:
          type: string
        fromAmount:
          type: number
        toAmount:
          type: number
          nullable: true
        rate:
          type: number
          description: "Commission rate as a decimal (e.g. 0.05 = 5%)"
      required: [id, fromAmount, toAmount, rate]

    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [flat, tiered, accelerator]
        flatRate:
          type: number
          nullable: true
          description: "Used when type=flat"
        acceleratorThreshold:
          type: number
          nullable: true
          description: "Deal value at which accelerator kicks in"
        acceleratorRate:
          type: number
          nullable: true
          description: "Rate applied above the accelerator threshold"
        clawbackDays:
          type: integer
          nullable: true
          description: "Number of days before commission is clawed back if deal cancels"
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/PlanTier"
        createdAt:
          type: string
      required: [id, name, type, flatRate, acceleratorThreshold, acceleratorRate, clawbackDays, tiers, createdAt]

    CreatePlanTier:
      type: object
      properties:
        fromAmount:
          type: number
        toAmount:
          type: number
          nullable: true
        rate:
          type: number
      required: [fromAmount, rate]

    CreatePlanBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [flat, tiered, accelerator]
        flatRate:
          type: number
          nullable: true
        acceleratorThreshold:
          type: number
          nullable: true
        acceleratorRate:
          type: number
          nullable: true
        clawbackDays:
          type: integer
          nullable: true
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/CreatePlanTier"
      required: [name, type]

    # ── Deal ─────────────────────────────────────────────────────────────────
    DealPaymentStatus:
      type: string
      enum: [unpaid, paid, partial, on_hold]

    Deal:
      type: object
      properties:
        id:
          type: string
        repId:
          type: string
        repName:
          type: string
        name:
          type: string
        amount:
          type: number
        closeDate:
          type: string
        period:
          type: string
          description: "YYYY-MM"
        stage:
          type: string
          enum: [closed_won, closed_lost, pending]
        currency:
          type: string
        paymentStatus:
          $ref: "#/components/schemas/DealPaymentStatus"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, repId, repName, name, amount, closeDate, period, stage, currency, paymentStatus, notes, createdAt]

    CreateDealBody:
      type: object
      properties:
        repId:
          type: string
        name:
          type: string
        amount:
          type: number
        closeDate:
          type: string
        period:
          type: string
        stage:
          type: string
          enum: [closed_won, closed_lost, pending]
        currency:
          type: string
        paymentStatus:
          $ref: "#/components/schemas/DealPaymentStatus"
          default: unpaid
        notes:
          type: string
          nullable: true
      required: [repId, name, amount, period, stage, currency]

    UpdateDealBody:
      type: object
      properties:
        repId:
          type: string
        name:
          type: string
        amount:
          type: number
        closeDate:
          type: string
        period:
          type: string
        stage:
          type: string
          enum: [closed_won, closed_lost, pending]
        currency:
          type: string
        paymentStatus:
          $ref: "#/components/schemas/DealPaymentStatus"
        notes:
          type: string
          nullable: true
      required: [repId, name, amount, period, stage, currency]

    ImportDealsBody:
      type: object
      properties:
        period:
          type: string
          description: "YYYY-MM period for these deals"
        deals:
          type: array
          items:
            $ref: "#/components/schemas/CreateDealBody"
      required: [period, deals]

    ImportDealsResult:
      type: object
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
      required: [imported, skipped, errors]

    # ── Commission Run ────────────────────────────────────────────────────────
    CommissionResult:
      type: object
      properties:
        id:
          type: string
        repId:
          type: string
        repName:
          type: string
        dealId:
          type: string
        dealName:
          type: string
        dealAmount:
          type: number
        rateApplied:
          type: number
        commissionAmount:
          type: number
        calculationNote:
          type: string
      required: [id, repId, repName, dealId, dealName, dealAmount, rateApplied, commissionAmount, calculationNote]

    CommissionRun:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
        totalCommission:
          type: number
        totalDeals:
          type: integer
        skippedDeals:
          type: integer
        repsCount:
          type: integer
        status:
          type: string
          enum: [pending, processing, completed, failed]
        error:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, period, totalCommission, totalDeals, skippedDeals, repsCount, status, createdAt]

    CommissionRunWithResults:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
        totalCommission:
          type: number
        totalDeals:
          type: integer
        skippedDeals:
          type: integer
        repsCount:
          type: integer
        status:
          type: string
          enum: [pending, processing, completed, failed]
        error:
          type: string
          nullable: true
        createdAt:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/CommissionResult"
      required: [id, period, totalCommission, totalDeals, skippedDeals, repsCount, status, createdAt, results]

    CreateRunBody:
      type: object
      properties:
        period:
          type: string
          description: "YYYY-MM period to calculate"
        paymentStatuses:
          type: array
          items:
            $ref: "#/components/schemas/DealPaymentStatus"
          description: "Filter to deals with these payment statuses"
      required: [period]

    # ── Dashboard ─────────────────────────────────────────────────────────────
    RepEarning:
      type: object
      properties:
        repId:
          type: string
        repName:
          type: string
        totalCommission:
          type: number
        totalDeals:
          type: integer
        totalRevenue:
          type: number
      required: [repId, repName, totalCommission, totalDeals, totalRevenue]

    DashboardSummary:
      type: object
      properties:
        period:
          type: string
        totalCommission:
          type: number
        totalRevenue:
          type: number
        totalDeals:
          type: integer
        totalReps:
          type: integer
        repEarnings:
          type: array
          items:
            $ref: "#/components/schemas/RepEarning"
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/CommissionRun"
      required: [period, totalCommission, totalRevenue, totalDeals, totalReps, repEarnings, recentRuns]

    RepDealResult:
      type: object
      properties:
        dealId:
          type: string
        dealName:
          type: string
        dealAmount:
          type: number
        closeDate:
          type: string
        rateApplied:
          type: number
        commissionAmount:
          type: number
        calculationNote:
          type: string
      required: [dealId, dealName, dealAmount, closeDate, rateApplied, commissionAmount, calculationNote]

    RepSummary:
      type: object
      properties:
        repId:
          type: string
        repName:
          type: string
        email:
          type: string
        planName:
          type: string
          nullable: true
        period:
          type: string
        totalCommission:
          type: number
        totalRevenue:
          type: number
        totalDeals:
          type: integer
        dealBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RepDealResult"
        monthlyHistory:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
              totalCommission:
                type: number
              totalDeals:
                type: integer
            required: [period, totalCommission, totalDeals]
      required: [repId, repName, email, planName, period, totalCommission, totalRevenue, totalDeals, dealBreakdown, monthlyHistory]

    ReportData:
      type: object
      properties:
        executiveSummary:
          type: object
          properties:
            totalRevenue:
              type: number
            totalCommission:
              type: number
            margin:
              type: number
            winRate:
              type: number
            avgDealSize:
              type: number
            totalDeals:
              type: integer
            pendingRevenue:
              type: number
            avgDaysToClose:
              type: integer
            commissionRatio:
              type: number
          required: [totalRevenue, totalCommission, margin, winRate, avgDealSize, totalDeals, pendingRevenue, avgDaysToClose, commissionRatio]
        dealStages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: integer
            required: [name, value]
        dealValueDistribution:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              count:
                type: integer
              value:
                type: number
            required: [label, count, value]
        paymentStatusBreakdown:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: integer
            required: [name, value]
        monthlyTrends:
          type: array
          items:
            type: object
            properties:
              period:
                type: string
              revenue:
                type: number
              commission:
                type: number
              deals:
                type: integer
            required: [period, revenue, commission, deals]
        monthlyGrowth:
          type: object
          properties:
            revenueGrowth:
              type: number
            commissionGrowth:
              type: number
            dealGrowth:
              type: number
          required: [revenueGrowth, commissionGrowth, dealGrowth]
        topPerformers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              commission:
                type: number
              revenue:
                type: number
              dealsWon:
                type: integer
              winRate:
                type: number
            required: [name, commission, revenue, dealsWon, winRate]
        repCommissionBreakdown:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              commission:
                type: number
              revenue:
                type: number
            required: [name, commission, revenue]
        topDeals:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              repName:
                type: string
              amount:
                type: number
              closeDate:
                type: string
            required: [name, repName, amount, closeDate]
      required: [executiveSummary, dealStages, monthlyTrends, monthlyGrowth, topPerformers]

    # ── API Keys ───────────────────────────────────────────────────────────────
    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        permissions:
          type: array
          items:
            type: string
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, prefix, permissions, createdAt]

    CreateApiKeyBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        permissions:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required: [name]

    CreatedApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
          description: The raw API key (only returned once at creation)
        prefix:
          type: string
        permissions:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, key, prefix, permissions, createdAt]
